<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Technology Showcase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff}

/* ─── HOME MENU ─── */
#home-menu {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: #000;
  transition: opacity .6s ease, transform .6s ease;
}
#home-menu.hidden {
  opacity: 0;
  transform: scale(.96);
  pointer-events: none;
}
.menu-header {
  text-align: center;
  margin-bottom: 48px;
}
.menu-header h1 {
  font-size: clamp(20px, 3vw, 32px);
  font-weight: 300;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.85);
}
.menu-header p {
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  margin-top: 8px;
}
.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  max-width: 900px;
  width: 90%;
  padding: 0 20px;
}
@media (max-width: 640px) {
  .menu-grid { grid-template-columns: 1fr; }
}
.brand-card {
  position: relative;
  background: rgba(255,255,255,.025);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 20px;
  padding: 48px 24px;
  text-align: center;
  cursor: pointer;
  transition: all .5s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}
.brand-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, var(--card-glow,rgba(88,166,255,.06)) 0%, transparent 70%);
  opacity: 0;
  transition: opacity .5s;
}
.brand-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,.14);
  background: rgba(255,255,255,.045);
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.brand-card:hover::before { opacity: 1; }
.brand-card .card-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .5s cubic-bezier(.4,0,.2,1);
}
.brand-card:hover .card-icon {
  transform: scale(1.08);
}
.brand-card .card-icon img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.brand-card .card-label {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: .03em;
  color: rgba(255,255,255,.9);
}
.brand-card .card-sub {
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  margin-top: 6px;
}

/* ─── VIDEO PLAYER ─── */
#video-player {
  position: fixed; inset: 0; z-index: 20;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}
#video-player.visible {
  opacity: 1;
  pointer-events: all;
}
.video-wrapper {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.video-frame {
  width: 100%;
  height: 100%;
  position: relative;
}
.video-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ─── BACK BUTTON ─── */
#back-btn {
  position: fixed;
  top: 28px;
  left: 28px;
  z-index: 30;
  background: rgba(0,0,0,.5);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: rgba(255,255,255,.8);
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all .3s;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
}
#back-btn.visible {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0);
}
#back-btn:hover {
  background: rgba(0,0,0,.7);
  border-color: rgba(255,255,255,.2);
  color: #fff;
}

/* ─── BRAND LABEL ─── */
#brand-label {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  font-weight: 600;
  opacity: 0;
  transition: opacity .5s;
}
#brand-label.visible { opacity: 1; }
</style>
</head>
<body>

<!-- HOME MENU -->
<div id="home-menu">
  <div style="text-align:center;width:100%">
    <div class="menu-header">
      <h1>Technology Showcase</h1>
      <p>Select a brand to experience</p>
    </div>
    <div class="menu-grid">
      <div class="brand-card" data-brand="windows" data-video="8sIQXKRncFo" style="--card-glow:rgba(88,166,255,.08)">
        <div class="card-icon"><img src="assets/logos/windows.svg" alt="Windows Logo"></div>
        <div class="card-label">Windows</div>
        <div class="card-sub">Microsoft</div>
      </div>
      <div class="brand-card" data-brand="snapdragon" data-video="tX00Kkae1Ic" style="--card-glow:rgba(228,0,43,.08)">
        <div class="card-icon"><img src="assets/logos/snapdragon.svg" alt="Snapdragon Logo"></div>
        <div class="card-label">Snapdragon</div>
        <div class="card-sub">Qualcomm</div>
      </div>
      <div class="brand-card" data-brand="qualcomm" data-video="yYiCqTGuwEs" style="--card-glow:rgba(196,18,48,.08)">
        <div class="card-icon"><img src="assets/logos/qualcomm.svg" alt="Qualcomm Logo"></div>
        <div class="card-label">Qualcomm</div>
        <div class="card-sub">AI & Connectivity</div>
      </div>
      <div class="brand-card" data-brand="amd" data-video="RnDSY8l0sQQ" style="--card-glow:rgba(237,28,36,.08)">
        <div class="card-icon"><img src="assets/logos/amd.svg" alt="AMD Logo"></div>
        <div class="card-label">AMD</div>
        <div class="card-sub">Compute & Graphics</div>
      </div>
    </div>
  </div>
</div>

<!-- VIDEO PLAYER -->
<div id="video-player">
  <div class="video-wrapper">
    <div class="video-frame" id="video-frame"></div>
  </div>
</div>

<!-- CONTROLS -->
<button id="back-btn">&#x2190; Back</button>
<div id="brand-label"></div>

<script>
(() => {
  const homeMenu = document.getElementById('home-menu');
  const videoPlayer = document.getElementById('video-player');
  const videoFrame = document.getElementById('video-frame');
  const backBtn = document.getElementById('back-btn');
  const brandLabel = document.getElementById('brand-label');

  let currentVideoId = null;

  function stopVideo() {
    videoFrame.innerHTML = '';
    currentVideoId = null;
  }

  function playVideo(videoId, brandName) {
    stopVideo();
    currentVideoId = videoId;

    // Hide menu
    homeMenu.classList.add('hidden');

    // Show player
    videoPlayer.classList.add('visible');
    backBtn.classList.add('visible');
    brandLabel.textContent = brandName;
    brandLabel.classList.add('visible');

    // Embed YouTube iframe with autoplay
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.title = `${brandName} Animation`;
    videoFrame.appendChild(iframe);
  }

  function goHome() {
    stopVideo();
    videoPlayer.classList.remove('visible');
    backBtn.classList.remove('visible');
    brandLabel.classList.remove('visible');
    homeMenu.classList.remove('hidden');
  }

  // Card click handlers
  document.querySelectorAll('.brand-card').forEach(card => {
    card.addEventListener('click', () => {
      const videoId = card.dataset.video;
      const brandName = card.dataset.brand;
      playVideo(videoId, brandName);
    });
  });

  // Back button
  backBtn.addEventListener('click', goHome);

  // Escape key to go back
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && videoPlayer.classList.contains('visible')) {
      goHome();
    }
  });
})();
</script>
</body>
</html>
